name: Render Backend Keep-Alive

on:
  schedule:
    # Runs every 10 minutes to prevent Render free-tier from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep_alive:
    name: Ping Render Service
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: |
          curl -f -s "https://mit-feedback-api.onrender.com/ping" || echo "Ping triggered"
